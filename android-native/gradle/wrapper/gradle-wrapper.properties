distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Dieselbe Fassung wie im Capacitor-Wrap, und aus demselben gemessenen Grund:
# Gradle 9.5.1 ist die juengste, die BEIDES kann — auf Java 25 laufen (ab 9.1,
# und das JBR von Android Studio IST Java 25) und AGP 8.x tragen (ab 9.6 fehlt
# dem AGP eine interne API). Zusaetzlicher Vorteil hier: Die Distribution liegt
# nach dem 1.x-Bau bereits im Wrapper-Cache, dieses Projekt laedt nichts nach.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-all.zip
# Pruefsumme der offiziellen Distribution. Der Wrapper verweigert damit jedes
# andere Archiv — derselbe Baustein fuer nachvollziehbare Builds wie in android/.
distributionSha256Sum=c72fb9991f6025cbe337d52ba77e531b3faf62bdd3e348fe1ccee9f51c71adb0
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
