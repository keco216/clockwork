apply plugin: 'com.android.application'

/* Signierung: Der Release-Schluessel liegt AUSSERHALB des Repos (Ordner
   clockwork-keys im Benutzerprofil, Anleitung in der dortigen SICHERUNG.md).
   Die Umgebungsvariable CLOCKWORK_KEYSTORE zeigt auf eine properties-Datei
   mit storeFile/storePassword/keyAlias/keyPassword. Ohne die Variable
   entsteht ein UNSIGNIERTES Release — so geraten weder Pfade noch
   Geheimnisse ins Repo oder in die CI, und wer das Repo klont, baut ohne
   Umbau Debug-APKs. */
def keystoreProps = null
def keystorePropsPath = System.getenv('CLOCKWORK_KEYSTORE')
if (keystorePropsPath != null && new File(keystorePropsPath).exists()) {
    keystoreProps = new Properties()
    new File(keystorePropsPath).withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "io.github.keco216.clockwork"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.keco216.clockwork"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionName folgt dem Web-Stand (package.json), versionCode ist
        // dieselbe Zahl als Major*10000 + Minor*100 + Patch — monoton, und
        // aus dem Code liest man die Version zurueck.
        versionCode 10504
        versionName "1.5.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystoreProps != null) {
            release {
                storeFile new File(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            /* R8 verkleinert nur die Java-Huelle; der Web-Inhalt liegt als
               Asset und bleibt byte-identisch. Capacitors Keep-Regeln kommen
               als consumer rules aus dem Paket mit — nachgemessen am
               Emulator, nicht nur angenommen. */
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreProps != null) {
                signingConfig signingConfigs.release
            }
            /* AAPT2s PNG-Cruncher bleibt AN — in v1.5.3 stand hier einmal
               `crunchPngs false`, in der Annahme, das Durchreichen unserer
               eigenen PNGs sei der deterministischere Weg. Das Gegenteil war
               der Fall: android-icons.mjs schreibt die PNGs mit Nodes zlib,
               und dessen Deflate-Strom haengt an der Node-Version. Der
               Cruncher hatte diese Abweichung bis dahin eingeebnet; ihn
               abzuschalten legte sie erst frei — statt einer wich danach ein
               Dutzend PNG-Dateien ab (gemessen gegen den F-Droid-Buildserver,
               Debian-Node 20.19.2 gegen Node 26 hier). Dazu kostete es 53 kB
               APK. Rueckgaengig gemacht in v1.5.4. */
        }
    }
    /* Kein Google-Metadatenblock im APK: AGP haengt sonst eine verschluesselte
       Abhaengigkeitsliste in den Signaturblock, die nur Google lesen kann.
       F-Droid lehnt genau das ab, und ein nicht pruefbarer Block passt auch
       sonst nicht zu diesem Projekt. */
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

/* Keine ART-Baseline-Profile. `assets/dexopt/baseline.prof` faellt bei AGP
   nicht deterministisch aus — ein bekannter Fehler, den F-Droid unter
   „Reproducible Builds" samt diesem Ausweg auffuehrt. Gemessen an v1.5.2:
   F-Droids Bau 1761 Byte, derselbe Commit hier 1759.

   Der Verzicht kostet fast nichts. Ein Baseline-Profil beschleunigt den
   Kaltstart von JAVA-Code; hier ist die Java-Seite eine duenne
   Capacitor-Bruecke, und die Oberflaeche ist eine HTML-Datei im WebView,
   die das Profil ohnehin nicht erreicht.

   Es beseitigt eine von mehreren Quellen der Nichtreproduzierbarkeit, aber
   NICHT alle: classes.dex (R8 unter anderem JDK), die Einzeldatei (Vite
   unter anderem Node) und die generierten PNGs (Nodes zlib) weichen
   weiterhin ab. Der Stand ist in docs/fdroid-vorbereitung.md gemessen
   festgehalten. */
tasks.whenTaskAdded { task ->
    if (task.name.contains('ArtProfile')) {
        task.enabled = false
    }
}

apply from: 'capacitor.build.gradle'
