distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Capacitor 8.5 liefert Gradle 8.14.3 aus; dessen Groovy kennt aber keine
# Java-25-Klassendateien, und genau die bringt das JBR des aktuellen Android
# Studio mit ("Unsupported class file major version 69" in der Skriptanalyse).
# 9.5.1 ist die juengste Fassung, die BEIDES kann: auf Java 25 laufen (ab 9.1)
# und AGP 8.x tragen — ab Gradle 9.6 fehlt dem AGP eine interne API, der
# Fehlertext dort nennt Gradle 9.5 ausdruecklich als den Ausweg.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-all.zip
# Pruefsumme der Distribution (offiziell von services.gradle.org): Der Wrapper
# verweigert dann jede Distribution, die nicht dieses Archiv ist — ein Baustein
# fuer nachvollziehbare Builds.
distributionSha256Sum=c72fb9991f6025cbe337d52ba77e531b3faf62bdd3e348fe1ccee9f51c71adb0
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
